<ion-card>
   @for( exposant of exposants | async;  track exposant.id )
  {
    <ion-card-header>
      <ion-card-title>{{exposant.nom}}</ion-card-title>
      <!--<ion-card-subtitle>Card Subtitle</ion-card-subtitle>-->
    </ion-card-header>

    <ion-card-content>
    <p>Id n° {{exposant.id}}</p>
    <p>Stand n° {{exposant.numStand}}</p>
    </ion-card-content>
  }
</ion-card>
