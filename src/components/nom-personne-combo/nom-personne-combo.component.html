<ion-input placeholder="Taper une partie du nom" [(ngModel)]="nom" (ionInput)="nomChanged($event)"></ion-input>
<ion-select>
  @for( personne of listePersonnes | async;  track personne.id )
  {
    <ion-select-option value="personne.nom">
      {{personne.nom}} {{personne.prenom}}
    </ion-select-option>
  }
</ion-select>
