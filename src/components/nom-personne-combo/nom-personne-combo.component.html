<ion-input 
  [label]="label()" 
  placeholder="Taper une partie du nom" 
  [(ngModel)]="nom" 
  (ionInput)="onNomChanged($event)"
  (click)="onInputClick($event)">
</ion-input>
@if(showList())
{
  <ion-card>
    <ion-card-content>
      <ion-list>
        @for( personne of listePersonnes | async;  track personne.id )
        {
          <ion-item (click)="onClickPersonneSelected( personne.nom, personne.prenom )" >
            {{personne.nom}} {{personne.prenom}}
          </ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card>
}
