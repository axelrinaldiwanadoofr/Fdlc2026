
<ion-input
  label="Titre du livre"
  placeholder="Taper une partie du titre"
  [(ngModel)]="recherche"
  (ionInput)="onRechercheChange($event)"
  (click)="onInputClick()">
</ion-input>

@if (showList()) {
  <ion-card>
    <ion-card-content>
      <ion-list>
        @for (livre of listeLivres | async; track livre.id) {
          <ion-item button="true"
                    (click)="onTitreSelected(livre.titre)">
            {{ livre.titre }}
          </ion-item>
        } @empty {
          <ion-item>
            @if (erreur()) {
              Service des livres indisponible
            } @else {
              Aucun livre trouvé
            }
          </ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card>
}
