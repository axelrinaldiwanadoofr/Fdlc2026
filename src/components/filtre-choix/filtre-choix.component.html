<!-- Pastille compacte : « Auteur ▾ » sans filtre, « Auteur : Ian Manook ✕ » avec filtre -->
<button type="button" class="pastille" [class.actif]="actif()" (click)="ouvrir( $event )"
        [attr.aria-label]="label() + ' : ' + libelleChoisi()" aria-haspopup="listbox" [attr.aria-expanded]="ouvert()">
  <span class="textes">
    <span class="label">{{ label() }}</span>
    @if( actif() ) { <span class="valeur">{{ libelleChoisi() }}</span> }
  </span>
  @if( actif() )
  {
    <ion-icon class="effacer" name="close-circle" role="button" aria-label="Retirer ce filtre" (click)="effacer($event)"></ion-icon>
  }
  @else
  {
    <ion-icon name="chevron-down" aria-hidden="true"></ion-icon>
  }
</button>

<!-- Recherche + liste, partagées entre la feuille (téléphone) et le menu déroulant (ordinateur) -->
<ng-template #recherchePart>
  @if( options().length > 6 )
  {
    <ion-searchbar [placeholder]="'Rechercher : ' + label().toLowerCase()" [debounce]="0"
                   (ionInput)="recherche.set( $any($event).detail.value ?? '' )"></ion-searchbar>
  }
</ng-template>

<ng-template #listePart>
  <ion-list lines="full" role="listbox" [attr.aria-label]="label()">
    @if( recherche() == "" )
    {
      <ion-item button [detail]="false" (click)="choisir( valeurVide() )" role="option" [attr.aria-selected]="!actif()">
        <ion-label>{{ libelleVide() }}</ion-label>
        @if( !actif() ) { <ion-icon slot="end" name="checkmark" color="primary"></ion-icon> }
      </ion-item>
    }
    @for( option of optionsFiltrees(); track option.valeur )
    {
      <ion-item button [detail]="false" (click)="choisir( option.valeur )" role="option"
                [attr.aria-selected]="option.valeur === valeur()" [class.choisi]="option.valeur === valeur()">
        <ion-label class="ion-text-wrap">{{ option.libelle }}</ion-label>
        @if( option.valeur === valeur() ) { <ion-icon slot="end" name="checkmark" color="primary"></ion-icon> }
      </ion-item>
    }
    @empty
    {
      <ion-item lines="none"><ion-label color="medium">Aucun résultat</ion-label></ion-item>
    }
  </ion-list>
</ng-template>

<!-- Téléphone : feuille qui monte du bas ; la liste défile sans devoir agrandir la feuille -->
<ion-modal [isOpen]="ouvert() && feuille()" (didDismiss)="fermer()" (didPresent)="focusRecherche( $event )"
           [breakpoints]="[0, 0.75, 1]" [initialBreakpoint]="0.75" [expandToScroll]="false">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ label() }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="fermer()">Fermer</ion-button>
        </ion-buttons>
      </ion-toolbar>
      @if( options().length > 6 )
      {
        <ion-toolbar class="barre-recherche"><ng-container [ngTemplateOutlet]="recherchePart"></ng-container></ion-toolbar>
      }
    </ion-header>
    <ion-content>
      <ng-container [ngTemplateOutlet]="listePart"></ng-container>
    </ion-content>
  </ng-template>
</ion-modal>

<!-- Ordinateur : menu déroulant sous la pastille -->
<ion-popover [isOpen]="ouvert() && !feuille()" [event]="evenementOuverture" (didDismiss)="fermer()"
             (didPresent)="focusRecherche( $event )" side="bottom" alignment="start" [arrow]="false"
             class="menu-filtre">
  <ng-template>
    <div class="menu">
      <ng-container [ngTemplateOutlet]="recherchePart"></ng-container>
      <div class="defilement">
        <ng-container [ngTemplateOutlet]="listePart"></ng-container>
      </div>
    </div>
  </ng-template>
</ion-popover>
