<!-- Champ compact : libellé + valeur choisie -->
<button type="button" class="champ" [class.actif]="actif()" (click)="ouvrir()"
        [attr.aria-label]="label() + ' : ' + libelleChoisi()">
  <span class="textes">
    <span class="label">{{ label() }}</span>
    <span class="valeur">{{ libelleChoisi() }}</span>
  </span>
  @if( actif() )
  {
    <ion-icon class="effacer" name="close-circle" role="button" aria-label="Retirer ce filtre" (click)="effacer($event)"></ion-icon>
  }
  @else
  {
    <ion-icon class="ouvrir" name="chevron-down" aria-hidden="true"></ion-icon>
  }
</button>

<!-- Liste avec recherche -->
<ion-modal [isOpen]="ouvert()" (didDismiss)="ouvert.set( false )" (didPresent)="focusRecherche( $event )"
           [breakpoints]="feuille() ? [0, 0.6, 1] : undefined"
           [initialBreakpoint]="feuille() ? 0.6 : undefined"
           [class.fenetre-centre]="!feuille()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>{{ label() }}</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="ouvert.set( false )">Fermer</ion-button>
        </ion-buttons>
      </ion-toolbar>
      @if( options().length > 6 )
      {
        <ion-toolbar>
          <ion-searchbar [placeholder]="'Rechercher : ' + label().toLowerCase()" [debounce]="0"
                         (ionInput)="recherche.set( $any($event).detail.value ?? '' )"></ion-searchbar>
        </ion-toolbar>
      }
    </ion-header>
    <ion-content>
      <ion-list>
        @if( recherche() == "" )
        {
          <ion-item button [detail]="false" (click)="choisir( valeurVide() )">
            <ion-label>{{ libelleVide() }}</ion-label>
            @if( !actif() ) { <ion-icon slot="end" name="checkmark" color="primary"></ion-icon> }
          </ion-item>
        }
        @for( option of optionsFiltrees(); track option.valeur )
        {
          <ion-item button [detail]="false" (click)="choisir( option.valeur )">
            <ion-label class="ion-text-wrap">{{ option.libelle }}</ion-label>
            @if( option.valeur === valeur() ) { <ion-icon slot="end" name="checkmark" color="primary"></ion-icon> }
          </ion-item>
        }
        @empty
        {
          <ion-item lines="none"><ion-label color="medium">Aucun résultat</ion-label></ion-item>
        }
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
