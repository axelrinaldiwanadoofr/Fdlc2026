<ion-list>
  @for( exposant of exposantsFiltres(); track exposant.id )
  {
    <ion-item [routerLink]="[lienPage(), exposant.id]">
      <ion-label class="ion-text-wrap"><div [innerHTML]="itemText(exposant)"></div></ion-label>
    </ion-item>
  }
</ion-list>
@if( exposants() && exposantsFiltres().length == 0 && messageVide() )
{
  <p class="liste-vide">{{ messageVide() }}</p>
}
