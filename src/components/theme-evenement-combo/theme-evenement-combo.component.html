<ion-input
  [label]="label()"
  placeholder="Taper le début du thème"
  [clearInput]="true"
  [(ngModel)]="saisie"
  (ionInput)="onThemeChanged($event)"
  (click)="onInputClick($event)">
</ion-input>
@if(showList())
{
  <ion-card>
    <ion-card-content>
      <ion-list>
        @for( theme of listeThemes() | async; track theme )
        {
          <ion-item button [detail]="false" (click)="onClickThemeSelected( theme )" [innerHTML]="itemText(theme)">
          </ion-item>
        }
        @empty
        {
          <ion-item lines="none" class="aucun">Aucun thème trouvé</ion-item>
        }
      </ion-list>
    </ion-card-content>
  </ion-card>
}
