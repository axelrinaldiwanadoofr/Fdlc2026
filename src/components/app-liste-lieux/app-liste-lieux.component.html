<ion-list>
  @for( lieu of listeLieux | async; track lieu.num )
  {
    <ion-item [routerLink]="['/page-lieu', lieu.num]" detail="true">
      <ion-label>
        <h2>{{ lieu.nom }}</h2>
        @if( lieu.libelle )
        {
          <p>{{ lieu.libelle }}</p>
        }
      </ion-label>
    </ion-item>
  }
  @empty
  {
    <ion-item lines="none">Aucun lieu trouvé</ion-item>
  }
</ion-list>
