<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Liste des livres</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Filtres de la page, appliqués directement à la liste -->
  <div class="filtres">
    <ion-searchbar
      placeholder="Titre, auteur ou éditeur"
      [value]="recherche()"
      (ionInput)="onRecherche( $event )"
      [debounce]="0"
      inputmode="search"
      aria-label="Rechercher un livre">
    </ion-searchbar>

    <div class="selections deux">
      <ion-select label="Auteur" labelPlacement="stacked" interface="popover" fill="solid"
                  [value]="auteur()" (ionChange)="auteur.set( $event.detail.value ?? '' )">
        <ion-select-option value="">Tous les auteurs</ion-select-option>
        @for( a of auteurs(); track a )
        {
          <ion-select-option [value]="a">{{ a }}</ion-select-option>
        }
      </ion-select>

      <ion-select label="Éditeur" labelPlacement="stacked" interface="popover" fill="solid"
                  [value]="editeur()" (ionChange)="editeur.set( $event.detail.value ?? '' )">
        <ion-select-option value="">Tous les éditeurs</ion-select-option>
        @for( e of editeurs(); track e )
        {
          <ion-select-option [value]="e">{{ e }}</ion-select-option>
        }
      </ion-select>
    </div>

    @if( filtreActif() )
    {
      <div class="resultat">
        <span>{{ total() }} livre{{ total() > 1 ? "s" : "" }} trouvé{{ total() > 1 ? "s" : "" }}</span>
        <ion-button fill="clear" size="small" (click)="effacer()">
          <ion-icon slot="start" name="close-circle-outline"></ion-icon>
          Effacer les filtres
        </ion-button>
      </div>
    }
  </div>

  <app-liste-livres
    childHtml="<strong>$titre</strong><br><small>$prenom $nom</small>"
    lienPage="/page-livre"
    [recherche]="recherche()"
    [auteur]="auteur()"
    [editeur]="editeur()"
    messageVide="Aucun livre ne correspond à ces critères."
    (total)="total.set( $event )"
    (charge)="onCharge( $event )">
  </app-liste-livres>
</ion-content>
