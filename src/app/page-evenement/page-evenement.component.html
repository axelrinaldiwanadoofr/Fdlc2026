
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title>Détail de l'événement</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <ion-label>
        <h2>Événement</h2>
        <p>Les informations de l'événement apparaîtront ici.</p>
      </ion-label>
    </ion-item>
  </ion-list>


  <app-titre-livre-combo
    [titres]="['Livre de test 1', 'Livre de test 2']"
    (titreSelectionne)="titreChoisi = $event">
  </app-titre-livre-combo>

  @if (titreChoisi) {
    <p>Vous avez sélectionné : {{ titreChoisi }}</p>
  }


</ion-content>
