<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/"></ion-back-button></ion-buttons>
    <ion-title>Liste des personnes</ion-title>
    <ion-buttons slot="end"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Filtres de la page, appliqués directement à la liste -->
  <div class="filtres">
    <ion-searchbar
      placeholder="Nom ou prénom"
      [value]="recherche()"
      (ionInput)="onRecherche( $event )"
      [debounce]="0"
      inputmode="search"
      aria-label="Rechercher une personne">
    </ion-searchbar>

    <div class="selections une">
      <ion-select label="Rôle" labelPlacement="stacked" interface="popover" fill="solid"
                  [value]="specialite()" (ionChange)="specialite.set( $event.detail.value ?? '' )">
        <ion-select-option value="">Tous les rôles</ion-select-option>
        @for( s of specialites(); track s )
        {
          <ion-select-option [value]="s">{{ s | majuscule }}</ion-select-option>
        }
      </ion-select>
    </div>

    @if( filtreActif() )
    {
      <div class="resultat">
        <span>{{ total() }} personne{{ total() > 1 ? "s" : "" }} trouvée{{ total() > 1 ? "s" : "" }}</span>
        <ion-button fill="clear" size="small" (click)="effacer()">
          <ion-icon slot="start" name="close-circle-outline"></ion-icon>
          Effacer les filtres
        </ion-button>
      </div>
    }
  </div>

  <app-liste-personnes
    childHtml="<strong>$civilite $prenom $nom</strong> | $specialite"
    lienPage="/page-personne"
    [recherche]="recherche()"
    [specialite]="specialite()"
    messageVide="Aucune personne ne correspond à ces critères."
    (total)="total.set( $event )"
    (charge)="onCharge( $event )"></app-liste-personnes>
</ion-content>
