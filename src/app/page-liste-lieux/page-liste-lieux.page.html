<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Liste des lieux</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Rechercher un lieu" [(ngModel)]="recherche" [debounce]="300"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-liste-lieux [recherche]="recherche"></app-liste-lieux>
</ion-content>
