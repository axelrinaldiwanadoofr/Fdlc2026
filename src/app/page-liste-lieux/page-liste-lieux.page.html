<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Lieux</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Filtres de la page, appliqués directement à la liste -->
  <div class="filtres">
    <ion-searchbar
      placeholder="Numéro ou nom du lieu"
      [value]="recherche()"
      (ionInput)="onRecherche( $event )"
      [debounce]="0"
      inputmode="search"
      aria-label="Rechercher un lieu">
    </ion-searchbar>

    <div class="selections deux">
      <ion-select label="Type" labelPlacement="stacked" interface="popover" fill="solid"
                  [value]="type()" (ionChange)="type.set( $event.detail.value ?? '' )">
        <ion-select-option value="">Tous les types</ion-select-option>
        @for( t of types(); track t )
        {
          <ion-select-option [value]="t">{{ t | majuscule }}</ion-select-option>
        }
      </ion-select>

      <ion-select label="Hall" labelPlacement="stacked" interface="popover" fill="solid"
                  [value]="hall()" (ionChange)="hall.set( $event.detail.value ?? -1 )">
        <ion-select-option [value]="-1">Tous les halls</ion-select-option>
        @for( h of halls(); track h )
        {
          <ion-select-option [value]="h">Hall {{ h }}</ion-select-option>
        }
      </ion-select>
    </div>

    @if( filtreActif() )
    {
      <div class="resultat">
        <span>{{ total() }} lieu{{ total() > 1 ? "x" : "" }} trouvé{{ total() > 1 ? "s" : "" }}</span>
        <ion-button fill="clear" size="small" (click)="effacer()">
          <ion-icon slot="start" name="close-circle-outline"></ion-icon>
          Effacer les filtres
        </ion-button>
      </div>
    }
  </div>

  <app-liste-lieux
    lienPage="/page-lieu"
    [recherche]="recherche()"
    [typeLieu]="type()"
    [hall]="hall()"
    (total)="total.set( $event )"
    (charge)="onCharge( $event )"></app-liste-lieux>
</ion-content>
