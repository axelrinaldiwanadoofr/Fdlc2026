<ion-tabs (ionTabsDidChange)="onTabChange( $event )">
  @for( hall of halls; track hall )
  {
    <ion-tab [tab]="'hall' + hall">
      <ion-header [translucent]="true">
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-back-button defaultHref="/"></ion-back-button>
          </ion-buttons>
          <ion-title>Plan du hall {{hall}}</ion-title>
          <ion-buttons slot="end">
            <ion-menu-button></ion-menu-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <app-plan-hall
          [numHall]="hall"
          [numLieu]="numLieu()"
          (onZoom)="zoomActif = $event"></app-plan-hall>
      </ion-content>
    </ion-tab>
  }

  <ion-tab-bar slot="bottom">
    @for( hall of halls; track hall )
    {
      <ion-tab-button [tab]="'hall' + hall">
        <ion-label>Hall {{hall}}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
