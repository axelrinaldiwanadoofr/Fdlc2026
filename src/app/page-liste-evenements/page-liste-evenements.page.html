<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Liste des événements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Événements</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-liste-evenements
    [titrePartie]="titreFiltre"
    [debut]="debutFiltre"
    [nomAnimateurPartie]="animateurFiltre"
    [titreLivrePartie]="livreFiltre"
    [lienPage]="'/page-evenement'">
  </app-liste-evenements>
</ion-content>
