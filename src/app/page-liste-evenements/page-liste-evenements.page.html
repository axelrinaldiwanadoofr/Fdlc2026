<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Liste des événements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Événements</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-list>
      <ion-item-divider color="light" sticky>
        <ion-label>Samedi</ion-label>
      </ion-item-divider>
      <app-liste-evenements
        childHtml="<strong>$heuredebut</strong> : $titre ($nomLieu)"
        [titrePartie]="titreFiltre"
        debut="2026-11-21 00:01"
        jourdebut="2026-11-21"
        [nomAnimateurPartie]="animateurFiltre"
        [titreLivrePartie]="livreFiltre"
        [lienPage]="'/page-evenement'">
      </app-liste-evenements>
      <ion-item-divider color="light" sticky>
        <ion-label>Samedi en continue</ion-label>
      </ion-item-divider>
      <app-liste-evenements
        childHtml="$titre ($nomLieu)"
        [titrePartie]="titreFiltre"
        [debut]="debutFiltre"
        jourdebut="2026-11-21"
        heuredebut="00:00"
        [nomAnimateurPartie]="animateurFiltre"
        [titreLivrePartie]="livreFiltre"
        [lienPage]="'/page-evenement'">
      </app-liste-evenements>
      <ion-item-divider color="light" sticky>
        <ion-label>Dimanche</ion-label>
      </ion-item-divider>
      <app-liste-evenements
        childHtml="<strong>$heuredebut</strong> : $titre ($nomLieu)"
        [titrePartie]="titreFiltre"
        debut="2026-11-22 00:01"
        jourdebut="2026-11-22"
        [nomAnimateurPartie]="animateurFiltre"
        [titreLivrePartie]="livreFiltre"
        [lienPage]="'/page-evenement'">
      </app-liste-evenements>
      <ion-item-divider color="light" sticky>
        <ion-label>Dimanche en continue</ion-label>
      </ion-item-divider>
      <app-liste-evenements
        childHtml="$titre ($nomLieu)"
        [titrePartie]="titreFiltre"
        [debut]="debutFiltre"
        jourdebut="2026-11-22"
        heuredebut="00:00"
        [nomAnimateurPartie]="animateurFiltre"
        [titreLivrePartie]="livreFiltre"
        [lienPage]="'/page-evenement'">
      </app-liste-evenements>
    </ion-list>
</ion-content>
