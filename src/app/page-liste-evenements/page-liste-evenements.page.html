<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Liste des événements</ion-title>
    <ion-buttons slot="start"><ion-back-button defaultHref="/"></ion-back-button></ion-buttons>
    <ion-buttons slot="end"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
  <ion-accordion-group>
    <ion-accordion value="rechercher">
      <ion-item slot="header" color="light"><ion-label>Rechercher / filtrer</ion-label></ion-item>
      <div class="ion-padding" slot="content">
        <ion-list>
          <ion-item>
            <ion-button (click)="onFiltrer()">Filtrer</ion-button>
            <ion-button fill="outline" (click)="onReinitialiser()">Réinitialiser</ion-button>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>
  </ion-accordion-group>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Événements</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-item-divider color="light" sticky>
      <ion-label>Samedi</ion-label>
    </ion-item-divider>
    <app-liste-evenements
      [titrePartie]="titreFiltre"
      debut="2026-11-21"
      [nomAnimateurPartie]="animateurFiltre"
      [titreLivrePartie]="livreFiltre"
      lienPage="'/page-evenement'"
      childHtml="<p><strong>$heureDebut</strong>: $nomLieu</p><p>$titre</p>">
    </app-liste-evenements>
    <ion-item-divider color="light" sticky>
      <ion-label>Dimanche</ion-label>
    </ion-item-divider>
    <app-liste-evenements
      [titrePartie]="titreFiltre"
      debut="2026-11-22"
      [nomAnimateurPartie]="animateurFiltre"
      [titreLivrePartie]="livreFiltre"
      lienPage="'/page-evenement'"
      childHtml="<p><strong>$heureDebut</strong>: $nomLieu</p><p>$titre</p>">
    </app-liste-evenements>
    <ion-item-divider color="light" sticky>
      <ion-label>Evénements permanents du samedi</ion-label>
    </ion-item-divider>
    <app-liste-evenements
      [titrePartie]="titreFiltre"
      debut="2026-11-21"
      permanent="true"
      [nomAnimateurPartie]="animateurFiltre"
      [titreLivrePartie]="livreFiltre"
      lienPage="'/page-evenement'"
      childHtml="<p><strong>$heureDebut</strong>: $nomLieu</p><p>$titre</p>">
    </app-liste-evenements>
    <ion-item-divider color="light" sticky>
      <ion-label>Evénements permanents du dimanche</ion-label>
    </ion-item-divider>
    <app-liste-evenements
      [titrePartie]="titreFiltre"
      debut="2026-11-22"
      permanent="true"
      [nomAnimateurPartie]="animateurFiltre"
      [titreLivrePartie]="livreFiltre"
      lienPage="'/page-evenement'"
      childHtml="<p><strong>$heureDebut</strong>: $nomLieu</p><p>$titre</p>">
    </app-liste-evenements>
  </ion-list>
</ion-content>
