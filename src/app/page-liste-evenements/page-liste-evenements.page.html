<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/"></ion-back-button></ion-buttons>
    <ion-title>Programme</ion-title>
    <ion-buttons slot="end"><ion-menu-button></ion-menu-button></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="filtres">
    <!-- Une pastille par filtre : chacune ouvre une liste défilante avec recherche.
         Téléphone : la rangée défile horizontalement ; ordinateur : elle passe à la ligne. -->
    <div class="pastilles" role="group" aria-label="Filtres">
      @for( f of filtres; track f.label )
      {
        <app-filtre-choix
          [label]="f.label"
          [libelleVide]="f.libelleVide"
          [options]="f.options()"
          [valeur]="f.valeur()"
          [valeurVide]="f.valeurVide"
          (valeurChange)="f.valeur.set( $event )">
        </app-filtre-choix>
      }
    </div>

    <!-- Nombre de résultats quand un filtre est utilisé -->
    @if( filtreActif() )
    {
      <div class="resume">
        <span class="resultat">
          @if( total() !== null )
          {
            {{ total() }} événement{{ total()! > 1 ? "s" : "" }}
          }
        </span>
        <ion-button fill="clear" size="small" (click)="effacer()">Tout effacer</ion-button>
      </div>
    }
  </div>

  <app-liste-evenements
    [theme]="$any( theme() )"
    [numLieu]="nombre( numLieu() )"
    [idAnimateur]="nombre( idAnimateur() )"
    [idPersonne]="nombre( idAuteur() )"
    [idLivre]="nombre( idLivre() )"
    [messageVide]="filtreActif() ? 'Aucun événement ne correspond à ces critères.' : 'Aucun événement'"
    (total)="total.set( $event )">
  </app-liste-evenements>
</ion-content>
