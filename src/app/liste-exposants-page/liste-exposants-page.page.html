<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Liste des exposants</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>    
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>    
  </ion-toolbar>
  <ion-accordion-group>
    <ion-accordion value="first">
      <ion-item slot="header" color="light">
        <ion-label>Rechercher / filtrer</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-list>
          <ion-item>
            <ion-label>Nom de lieu:</ion-label>
            <app-nom-lieu-combo></app-nom-lieu-combo>
          </ion-item>
          <ion-item>
            <app-nom-personne-combo 
              label="Auteur:"
              (onPersonneSelected)="onAuteurSelected( $event )"></app-nom-personne-combo>
          </ion-item>
        </ion-list>
      </div>
    </ion-accordion>  
  </ion-accordion-group>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">liste-exposants-page</ion-title>
    </ion-toolbar>
    </ion-header>
    <app-liste-exposant 
      childHtml="<strong>$nom</strong> : stand n° $numLieu"
      lienPage="/page-exposant"></app-liste-exposant>
</ion-content>
