<ion-app>
  <ion-menu side="end" menuId="first" contentId="main">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list class="menu">
        @for( page of pages; track page.lien )
        {
          <ion-menu-toggle auto-hide="false">
            <ion-item [routerLink]="page.lien" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }" lines="none" [detail]="false">
              <ion-icon slot="start" [name]="page.icone"></ion-icon>
              <ion-label>{{page.titre}}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>
    </ion-content>
    <ion-footer class="pied-menu">
      <p class="dates">{{ serviceParametre.dates() }}</p>
      <p>{{ serviceParametre.reglages().lieu }}</p>
      <ion-menu-toggle auto-hide="false">
        <a routerLink="/donnees-personnelles">Données personnelles</a>
      </ion-menu-toggle>
      <a class="credit" [href]="serviceParametre.reglages().lienLycee" target="_blank" rel="noopener">
        Application réalisée par les BTS SIO du lycée Camille Sée
      </a>
    </ion-footer>
  </ion-menu>
  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
